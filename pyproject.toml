[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "user-machine-constitution"
version = "0.1.0"
description = "Create, validate, stress-test, and render bilateral human-agent constitutions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Santi Pochat"}]

[project.scripts]
user-machine-constitution = "user_machine_constitution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
user_machine_constitution = ["templates/*"]
